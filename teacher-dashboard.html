<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><style>:root{--bg:#07131f;--p:#0d2235;--p2:#102b43;--line:#244a67;--txt:#edf7ff;--mut:#9db6c9;--acc:#55d6ff;--ok:#70e3a4;--warn:#ffd166;--bad:#ff8795}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--txt)}header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;margin-right:auto}.brand span{color:var(--acc)}button,input{font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--acc);color:#042033}.secondary{background:#18364e;color:white;border:1px solid var(--line)}main{width:min(1300px,100%);margin:auto;padding:20px}.panel{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.login input{padding:12px;border-radius:10px;border:1px solid var(--line);background:#071723;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{display:block;font-size:28px;color:var(--acc)}.muted{color:var(--mut)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut)}tr.student{cursor:pointer}tr.student:hover{background:#102b43}.weak{color:var(--bad);font-weight:900}.developing{color:var(--warn);font-weight:900}.secure{color:var(--ok);font-weight:900}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font-size:12px}.empty{padding:22px;text-align:center;color:var(--mut)}@media(max-width:800px){.login,.grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.login,.grid{grid-template-columns:1fr}main{padding:10px}table{font-size:12px}}</style></head><body><header><div class="brand">SPM <span>SCIENCE</span> · Teacher Dashboard</div><button class="btn secondary" onclick="location.href='index.html'">Back to Practice</button><button class="btn secondary" onclick="loadStudents()">Refresh</button></header><main><section class="panel"><h2>Teacher Access</h2><div class="login"><input id="api" placeholder="Worker API URL, e.g. https://...workers.dev"><input id="key" type="password" placeholder="Teacher key"><button class="btn primary" onclick="connect()">Connect</button></div><p id="state" class="muted"></p></section><section class="grid"><div class="stat"><b id="total">0</b>Students</div><div class="stat"><b id="active">0</b>With attempts</div><div class="stat"><b id="done">0</b>Completed attempts</div><div class="stat"><b id="classavg">0%</b>Average</div></section><section class="panel"><h2>Students</h2><div id="students"></div></section><section class="panel" id="detailPanel" style="display:none"><h2 id="studentTitle">Student Detail</h2><div id="detail"></div></section></main><script>api.value=localStorage.getItem('science2026_api')||'';key.value=sessionStorage.getItem('science2026_teacher_key')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function request(path){const base=api.value.trim().replace(/\/$/,'');if(!base)throw new Error('Enter Worker API URL');const r=await fetch(base+path,{headers:{'x-teacher-key':key.value}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}function connect(){localStorage.setItem('science2026_api',api.value.trim().replace(/\/$/,''));sessionStorage.setItem('science2026_teacher_key',key.value);loadStudents()}async function loadStudents(){try{state.textContent='Loading...';const d=await request('/api/teacher/students');renderStudents(d.students||[]);state.textContent='Connected · '+new Date().toLocaleString()}catch(e){state.textContent=e.message}}function renderStudents(rows){total.textContent=rows.length;active.textContent=rows.filter(x=>Number(x.attempts)>0).length;done.textContent=rows.reduce((n,x)=>n+Number(x.completed||0),0);const vals=rows.filter(x=>x.avg_percent!==null&&x.avg_percent!==undefined).map(x=>Number(x.avg_percent));classavg.textContent=(vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0)+'%';students.innerHTML=rows.length?'<table><tr><th>Student</th><th>Class</th><th>Attempts</th><th>Completed</th><th>Average</th><th>Last Activity</th></tr>'+rows.map(x=>`<tr class="student" onclick="openStudent('${esc(x.id)}')"><td><b>${esc(x.name)}</b></td><td>${esc(x.class_name||'-')}</td><td>${esc(x.attempts||0)}</td><td>${esc(x.completed||0)}</td><td>${x.avg_percent==null?'-':Math.round(x.avg_percent)+'%'}</td><td>${x.last_activity?new Date(x.last_activity).toLocaleString():'-'}</td></tr>`).join('')+'</table>':'<div class="empty">No students yet.</div>'}async function openStudent(id){try{const d=await request('/api/teacher/student/'+encodeURIComponent(id));studentTitle.textContent=d.student.name+' · '+(d.student.class_name||'');detailPanel.style.display='block';renderDetail(d);detailPanel.scrollIntoView({behavior:'smooth'})}catch(e){alert(e.message)}}function renderDetail(d){const a=d.attempts||[],ans=d.answers||[],w=d.wrong_answers||[],ws=d.weaknesses||[];detail.innerHTML=`<h3>Current / Past Progress</h3>${a.length?'<table><tr><th>Set</th><th>Status</th><th>Current question</th><th>Progress</th><th>Score</th><th>Updated</th></tr>'+a.map(x=>`<tr><td><b>${esc(x.set_label)}</b><br><span class="muted">${esc(x.paper)}</span></td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.current_question||'-')}</td><td>${x.attempted_count}/${x.total_questions}</td><td>${x.max_score?x.score+'/'+x.max_score+' ('+Math.round(x.percent)+'%)':'-'}</td><td>${new Date(x.updated_at).toLocaleString()}</td></tr>`).join('')+'</table>':'<div class="empty">No attempts.</div>'}<h3>Weakness & Remedial Action</h3>${ws.length?'<table><tr><th>Chapter</th><th>Subtopic</th><th>Accuracy</th><th>Level</th><th>Remedy</th></tr>'+ws.map(x=>`<tr><td>${esc(x.chapter)}</td><td>${esc(x.subtopic)}</td><td>${x.correct}/${x.total} · ${x.accuracy}%</td><td class="${String(x.level).toLowerCase()}">${esc(x.level)}</td><td>${esc(x.remedy)}</td></tr>`).join('')+'</table>':'<div class="empty">Not enough data.</div>'}<h3>Wrong Questions</h3>${w.length?'<table><tr><th>Question</th><th>Student Answer</th><th>Correct Answer</th><th>Chapter / Skill</th></tr>'+w.map(x=>`<tr><td><b>${esc(x.set_id)} · ${esc(x.paper)} · ${esc(x.question_id)}</b></td><td>${esc(x.student_answer)}</td><td>${esc(x.correct_answer)}</td><td>${esc(x.chapter)}<br>${esc(x.subtopic)}<br><span class="muted">${esc(x.skill)}</span></td></tr>`).join('')+'</table>':'<div class="empty">No wrong answers recorded.</div>'}<h3>All Answer Records</h3><p class="muted">${ans.length} answer records stored.</p>`}if(api.value&&key.value)loadStudents();</script></body></html>
