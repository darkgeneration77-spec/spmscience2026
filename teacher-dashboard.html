<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><style>:root{--bg:#07131f;--p:#0d2235;--p2:#102b43;--line:#244a67;--txt:#edf7ff;--mut:#9db6c9;--acc:#55d6ff;--ok:#70e3a4;--warn:#ffd166;--bad:#ff8795}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--txt)}header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;margin-right:auto}.brand span{color:var(--acc)}button{font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--acc);color:#042033}.secondary{background:#18364e;color:white;border:1px solid var(--line)}main{width:min(1300px,100%);margin:auto;padding:20px}.panel{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{display:block;font-size:28px;color:var(--acc)}.muted{color:var(--mut)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut)}tr.student{cursor:pointer}tr.student:hover{background:#102b43}.weak{color:var(--bad);font-weight:900}.developing{color:var(--warn);font-weight:900}.secure{color:var(--ok);font-weight:900}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font-size:12px}.empty{padding:22px;text-align:center;color:var(--mut)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid{grid-template-columns:1fr}main{padding:10px}table{font-size:12px}}</style></head><body><header><div class="brand">SPM <span>SCIENCE</span> · Teacher Dashboard</div><button class="btn secondary" onclick="location.href='index.html'">Back to Practice</button><button class="btn secondary" onclick="loadStudents()">Refresh</button></header><main><section class="grid"><div class="stat"><b id="total">0</b>Students</div><div class="stat"><b id="active">0</b>Answered questions</div><div class="stat"><b id="wrongTotal">0</b>Wrong answers</div><div class="stat"><b id="classavg">0%</b>Class accuracy</div></section><section class="panel"><h2>Students</h2><p id="state" class="muted"></p><div id="students"></div></section><section class="panel" id="detailPanel" style="display:none"><h2 id="studentTitle">Student Detail</h2><div id="detail"></div></section></main><script>const API='https://spm-science-2026-api.darkgeneration77.workers.dev';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function request(path){const r=await fetch(API+path);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}function level(m){return m<60?'Weak':m<80?'Developing':'Secure'}function remedy(x){const s=((x.chapter||'')+' '+(x.subtopic||'')+' '+(x.skill||'')).toLowerCase();if(s.includes('rate'))return 'Review rate = change ÷ time, graph gradient and collision theory; assign targeted calculation and explanation questions.';if(s.includes('electro'))return 'Revise anode/cathode, ion movement and electroplating; assign labelled cell and ion-discharge questions.';if(s.includes('carbon'))return 'Revise hydrocarbons, alcohol/ester, fats and palm-oil applications; assign keyword recall and application questions.';if(s.includes('pressure')||s.includes('pascal')||s.includes('bernoulli'))return 'Revise Pascal and Bernoulli relationships; assign pressure-velocity diagram explanations.';if(s.includes('green'))return 'Revise carbon footprint, waste management and Green Technology applications; assign justification questions.';return 'Review the weakest subtopic and redo recent wrong questions with required science keywords.'}async function loadStudents(){try{state.textContent='Loading...';const d=await request('/api/teacher/students');renderStudents(d.students||[]);state.textContent='Connected · '+new Date().toLocaleString()}catch(e){state.textContent=e.message}}function renderStudents(rows){total.textContent=rows.length;const answered=rows.reduce((n,x)=>n+Number(x.questions_answered||0),0);const wrong=rows.reduce((n,x)=>n+Number(x.wrong_answers||0),0);active.textContent=answered;wrongTotal.textContent=wrong;const vals=rows.filter(x=>x.accuracy!==null&&x.accuracy!==undefined).map(x=>Number(x.accuracy));classavg.textContent=(vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0)+'%';students.innerHTML=rows.length?'<table><tr><th>Student</th><th>Class</th><th>Answered</th><th>Correct</th><th>Wrong</th><th>Accuracy</th><th>Last Activity</th></tr>'+rows.map(x=>`<tr class="student" onclick="openStudent('${esc(x.student_id)}')"><td><b>${esc(x.name)}</b></td><td>${esc(x.class_name||'-')}</td><td>${esc(x.questions_answered||0)}</td><td>${esc(x.correct_answers||0)}</td><td>${esc(x.wrong_answers||0)}</td><td>${x.accuracy==null?'-':Math.round(x.accuracy)+'%'}</td><td>${esc(x.last_active_at||'-')}</td></tr>`).join('')+'</table>':'<div class="empty">No students yet.</div>'}async function openStudent(id){try{const d=await request('/api/teacher/student?student_id='+encodeURIComponent(id));studentTitle.textContent=(d.student?.name||id)+' · '+(d.student?.class_name||'');detailPanel.style.display='block';renderDetail(d);detailPanel.scrollIntoView({behavior:'smooth'})}catch(e){alert(e.message)}}function renderDetail(d){const p=d.progress||[],ws=d.weakness?.results||d.weakness||[];const w=p.filter(x=>Number(x.is_correct)===0);detail.innerHTML=`<h3>Weakness & Remedial Action</h3>${ws.length?'<table><tr><th>Chapter</th><th>Subtopic</th><th>Accuracy</th><th>Level</th><th>Remedy</th></tr>'+ws.map(x=>{const m=Number(x.mastery||0),l=level(m);return `<tr><td>${esc(x.chapter||'Unclassified')}</td><td>${esc(x.subtopic||'')}</td><td>${esc(x.correct||0)}/${esc(x.total||0)} · ${m}%</td><td class="${l.toLowerCase()}">${l}</td><td>${esc(remedy(x))}</td></tr>`}).join('')+'</table>':'<div class="empty">Not enough data.</div>'}<h3>Wrong Questions</h3>${w.length?'<table><tr><th>Question</th><th>Student Answer</th><th>Correct Answer</th><th>Chapter / Skill</th></tr>'+w.map(x=>`<tr><td><b>${esc(x.set_name)} · ${esc(x.paper)} · ${esc(x.question_id)}</b></td><td>${esc(x.student_answer)}</td><td>${esc(x.correct_answer)}</td><td>${esc(x.chapter)}<br>${esc(x.subtopic)}<br><span class="muted">${esc(x.skill)}</span></td></tr>`).join('')+'</table>':'<div class="empty">No wrong answers recorded.</div>'}<h3>All Answer Records</h3><p class="muted">${p.length} answer records stored.</p>`}loadStudents();</script></body></html>
