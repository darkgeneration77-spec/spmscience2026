<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><style>:root{--bg:#07131f;--p:#0d2235;--p2:#102b43;--line:#244a67;--txt:#edf7ff;--mut:#9db6c9;--acc:#55d6ff;--ok:#70e3a4;--warn:#ffd166;--bad:#ff8795}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--txt)}header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;margin-right:auto}.brand span{color:var(--acc)}button,input{font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--acc);color:#042033}.secondary{background:#18364e;color:white;border:1px solid var(--line)}main{width:min(1180px,100%);margin:auto;padding:22px}.panel{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.profile{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.profile input{padding:12px;border-radius:10px;border:1px solid var(--line);background:#071723;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{display:block;font-size:28px;color:var(--acc)}h2{margin:0 0 14px}.muted{color:var(--mut)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{color:var(--mut)}.bar{height:8px;background:#071723;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--acc)}.weak{color:var(--bad);font-weight:800}.developing{color:var(--warn);font-weight:800}.secure{color:var(--ok);font-weight:800}.empty{padding:24px;text-align:center;color:var(--mut)}.focus{border:1px solid var(--warn);background:#2d2717;border-radius:14px;padding:16px}.focus b{color:var(--warn);font-size:18px}.setgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.setcard{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:14px}.sethead{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--line)}.status.done{color:var(--ok)}.status.work{color:var(--warn)}.status.none{color:var(--mut)}@media(max-width:780px){.profile,.grid,.setgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.profile,.grid,.setgrid{grid-template-columns:1fr}main{padding:12px}table{font-size:13px}}</style></head><body><header><div class="brand">SPM <span>SCIENCE</span> · Student Dashboard</div><button class="btn secondary" onclick="location.href='index.html'">Back to Practice</button><button class="btn secondary" onclick="loadDash()">Refresh</button></header><main><section class="panel"><h2>Student Profile</h2><div class="profile"><input id="name" placeholder="Student name"><input id="cls" placeholder="Class"><button class="btn primary" onclick="saveProfile()">Save Profile</button></div><p class="muted" id="apiState"></p></section><section class="grid"><div class="stat"><b id="attempts">0</b>Practice attempts</div><div class="stat"><b id="completed">0</b>Completed</div><div class="stat"><b id="avg">0%</b>Average score</div><div class="stat"><b id="wrong">0</b>Wrong answers</div></section><section class="panel"><h2>Continue From Here</h2><div id="continueBox"></div></section><section class="panel"><h2>Your Set Progress</h2><div id="setProgress"></div></section><section class="panel"><h2>Study Priority</h2><div id="priority"></div></section><section class="panel"><h2>Weakness Analysis & Remedial Action</h2><div id="weakness"></div></section><section class="panel"><h2>Recent Wrong Questions</h2><div id="wrongList"></div></section></main><script>const API='https://spm-science-2026-api.darkgeneration77.workers.dev';const EXPECTED=['Set 2','Set 3','Set 4','Set 5','Set 6','TP Set 13','TP Set 14','TP Set 15','TP Set 16','TP Set 17','TP Set 18','Selected Units'];let sid=localStorage.getItem('science2026_student_id')||'';if(!sid){sid=(crypto.randomUUID?crypto.randomUUID():'stu-'+Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem('science2026_student_id',sid)}name.value=localStorage.getItem('science2026_student_name')||'';cls.value=localStorage.getItem('science2026_student_class')||'';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function req(path,opt={}){const r=await fetch(API+path,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}async function saveProfile(){const n=name.value.trim();if(!n)return alert('Enter student name.');localStorage.setItem('science2026_student_name',n);localStorage.setItem('science2026_student_class',cls.value.trim());try{await req('/api/student',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({student_id:sid,name:n,class_name:cls.value.trim()})});apiState.textContent='Profile saved.';loadDash()}catch(e){apiState.textContent=e.message}}async function loadDash(){if(!name.value.trim()){continueBox.innerHTML='<div class="empty">Save your student profile first.</div>';return}try{const d=await req('/api/student-dashboard?student_id='+encodeURIComponent(sid));render(d);apiState.textContent='Last updated: '+new Date().toLocaleString()}catch(e){apiState.textContent=e.message}}function level(m){return m<60?'Weak':m<80?'Developing':'Secure'}function remedy(x){const s=((x.chapter||'')+' '+(x.subtopic||'')+' '+(x.skill||'')).toLowerCase();if(s.includes('rate'))return 'Review rate = change ÷ time, graph gradient and collision theory; redo 3 targeted questions.';if(s.includes('electro'))return 'Revise anode/cathode, ion movement and electroplating; practise labelled cell diagrams.';if(s.includes('carbon'))return 'Revise hydrocarbons, alcohol/ester, fats and palm-oil applications; practise keyword recall.';if(s.includes('pressure')||s.includes('pascal')||s.includes('bernoulli'))return 'Revise Pascal and Bernoulli relationships; practise diagram explanation using pressure and velocity keywords.';if(s.includes('green'))return 'Revise carbon footprint, waste management and Green Technology applications; practise justification questions.';return 'Review this subtopic and redo recent wrong questions using the required science keywords.'}function qnum(q){const m=String(q||'').match(/\d+/);return m?Number(m[0]):0}function setSummary(p,a){return EXPECTED.map(s=>{const rows=p.filter(x=>x.set_name===s);const att=a.filter(x=>x.set_name===s);const wrong=rows.filter(x=>Number(x.is_correct)===0).length,correct=rows.filter(x=>Number(x.is_correct)===1).length,total=rows.length,acc=total?Math.round(correct/total*100):0;const done=att.some(x=>Number(x.completed)===1);const last=rows.slice().sort((x,y)=>String(y.answered_at||'').localeCompare(String(x.answered_at||'')))[0];return{set:s,total,wrong,acc,done,last}})}function render(d){const a=d.attempts||[],p=d.progress||[],ws=d.weaknesses||[];const w=p.filter(x=>Number(x.is_correct)===0);attempts.textContent=a.length;completed.textContent=a.filter(x=>Number(x.completed)===1).length;const scored=a.filter(x=>Number(x.total_marks)>0);avg.textContent=(scored.length?Math.round(scored.reduce((s,x)=>s+Number(x.percentage||0),0)/scored.length):0)+'%';wrong.textContent=w.length;const last=p.slice().sort((x,y)=>String(y.answered_at||'').localeCompare(String(x.answered_at||'')))[0];continueBox.innerHTML=last?`<div class="card"><b>${esc(last.set_name)} · ${esc(last.paper)} · ${esc(last.question_id)}</b><p class="muted">Last activity: ${esc(last.answered_at||'-')}</p><button class="btn primary" onclick="location.href='index.html'">Continue Practice</button></div>`:'<div class="empty">No answer record yet.</div>';const sets=setSummary(p,a);setProgress.innerHTML='<div class="setgrid">'+sets.map(x=>{const st=x.done?'done':x.total?'work':'none',lab=x.done?'Completed':x.total?'In progress':'Not started';const pct=x.total?Math.min(100,Math.round(x.total/40*100)):0;return `<div class="setcard"><div class="sethead"><b>${esc(x.set)}</b><span class="status ${st}">${lab}</span></div><div class="muted">${x.total} answers · ${x.wrong} wrong · ${x.total?x.acc+'%':'-'}</div><div class="bar"><i style="width:${pct}%"></i></div>${x.last?`<div class="muted" style="margin-top:7px">Last: ${esc(x.last.paper)} ${esc(x.last.question_id)}</div>`:''}</div>`}).join('')+'</div>';const weakest=ws.slice().sort((x,y)=>Number(x.mastery||0)-Number(y.mastery||0))[0];priority.innerHTML=weakest?`<div class="focus"><b>Focus first: ${esc(weakest.chapter||'Unclassified')} ${esc(weakest.subtopic||'')}</b><p>${Number(weakest.mastery||0)}% mastery. ${esc(remedy(weakest))}</p></div>`:'<div class="empty">Answer more questions to generate a study priority.</div>';weakness.innerHTML=ws.length?'<table><tr><th>Chapter / Subtopic</th><th>Accuracy</th><th>Level</th><th>Remedial Action</th></tr>'+ws.map(x=>{const m=Number(x.mastery||0),l=level(m);return `<tr><td><b>${esc(x.chapter||'Unclassified')}</b><br>${esc(x.subtopic||'')}</td><td>${esc(x.correct_questions||0)}/${esc(x.total_questions||0)} · ${m}%</td><td class="${l.toLowerCase()}">${l}</td><td>${esc(remedy(x))}</td></tr>`}).join('')+'</table>':'<div class="empty">Not enough answered questions for weakness analysis.</div>';wrongList.innerHTML=w.length?'<table><tr><th>Question</th><th>Your answer</th><th>Correct answer</th><th>Topic</th></tr>'+w.slice(0,30).map(x=>`<tr><td><b>${esc(x.set_name)} · ${esc(x.paper)} · ${esc(x.question_id)}</b></td><td>${esc(x.student_answer)}</td><td>${esc(x.correct_answer)}</td><td>${esc(x.chapter)}<br><span class="muted">${esc(x.subtopic)}</span></td></tr>`).join('')+'</table>':'<div class="empty">No wrong answers recorded.</div>'}if(name.value.trim())loadDash();</script></body></html>
